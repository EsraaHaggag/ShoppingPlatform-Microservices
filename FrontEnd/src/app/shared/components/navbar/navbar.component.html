<nav class="navbar">

  <div class="navbar-container">

    <!-- Logo -->

    <div class="navbar-left">

      <a
        routerLink="/"
        class="logo">

        <span class="logo-mark">
          S
        </span>

        <span class="logo-text">
          ShopFlow
        </span>

      </a>

    </div>


    <!-- Navigation -->

    <div class="navbar-center">

      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">

        Home

      </a>

      <a
        routerLink="/products"
        routerLinkActive="active">

        Products

      </a>

      <a
        routerLink="/orders"
        routerLinkActive="active">

        Orders

      </a>

    </div>


    <!-- Actions -->

    <div class="navbar-right">

      <a
        routerLink="/cart"
        class="icon-button cart-icon"
        aria-label="Shopping cart">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2">

          <path
            d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 8H6">
          </path>

          <circle
            cx="10"
            cy="20"
            r="1">
          </circle>

          <circle
            cx="18"
            cy="20"
            r="1">
          </circle>

        </svg>

        <span class="cart-count">
          {{ cartCount() }}
        </span>

      </a>


      <button
        type="button"
        class="user-button"
        aria-label="Account">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2">

          <circle
            cx="12"
            cy="8"
            r="4">
          </circle>

          <path
            d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7">
          </path>

        </svg>

      </button>

    </div>

  </div>

</nav>
